name: Research (manual)
on:
  workflow_dispatch:
    inputs:
      candidates:
        description: Number of candidates
        default: "300"
permissions:
  contents: write
concurrency:
  group: atl-state
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          scripts/run.sh 'verify' python -m atl verify
          scripts/run.sh 'features' python -m atl features
          scripts/run.sh 'research -n ${{ inputs.candidates }}' python -m atl research -n ${{ inputs.candidates }}
      - uses: ./.github/actions/persist
        with:
          message: "research: manual run"
          save-data: "false"
