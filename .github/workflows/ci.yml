name: CI
on:
  push:
    paths: ["atl/**", "tests/**", "config/**", "requirements.txt", "scripts/**", ".github/workflows/ci.yml"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          restore-data: "false"
      - name: Tests (synthetic market; leakage, accounting, ledger, gate)
        run: scripts/run.sh pytest python -m pytest -q -W ignore --tb=short
