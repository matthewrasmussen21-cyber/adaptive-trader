name: Alert test
# Temporary: verifies the alert pipeline. Fails when .github/alert-test.txt says "fail".
on:
  push:
    paths: [".github/alert-test.txt"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if grep -q fail .github/alert-test.txt; then
            echo "::error title=alert test::This is a deliberate test failure to check that alerts reach you."
            exit 1
          fi
