name: Monthly
# Refresh listings, run the review agent, then a research run informed by its findings.
on:
  schedule:
    - cron: "17 15 1 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: atl-state
  cancel-in-progress: false
jobs:
  monthly:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: |
          scripts/run.sh 'verify' python -m atl verify
          scripts/run.sh 'data listings' python -m atl data listings
          scripts/run.sh 'data prices' python -m atl data prices
          scripts/run.sh 'data macro' python -m atl data macro
          scripts/run.sh 'features' python -m atl features
          scripts/run.sh 'review' python -m atl review
          scripts/run.sh 'research --after-review' python -m atl research --after-review
      - uses: ./.github/actions/persist
        with:
          message: "monthly: review + research"
